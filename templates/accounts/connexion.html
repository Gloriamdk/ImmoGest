{% extends "base.html" %}

{% block content %}
<div class="card">
    <h1>Connexion</h1>

    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Se connecter</button>
    </form>

    <p>
        Pas encore de compte ?
        <a href="{% url 'accounts:inscription' %}">Créer un compte</a>
    </p>
</div>
{% endblock %}
