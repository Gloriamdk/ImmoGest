{% extends "base.html" %}

{% block content %}
<div class="card">
    <h1>Mot de passe oublié</h1>
    <p>Entrez votre email pour recevoir un lien de réinitialisation.</p>

    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}

        <button type="submit">Envoyer le lien</button>
    </form>

    <a href="{% url 'accounts:login' %}" class="btn-secondary">
        Retour
    </a>
</div>
{% endblock %}
