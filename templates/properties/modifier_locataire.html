{% extends "base.html" %}

{% block content %}
<div class="card">
    <h1>Modifier le locataire</h1>

    <form method="post">
        {% csrf_token %}

        <label>Nom d'utilisateur</label>
        <input type="text" name="username" value="{{ locataire.user.username }}" required>

        <label>Email</label>
        <input type="email" name="email" value="{{ locataire.user.email }}" required>

        <label>Téléphone</label>
        <input type="text" name="telephone" value="{{ locataire.user.telephone }}">

        <label>Adresse actuelle</label>
        <input type="text" name="adresse" value="{{ locataire.adresse_actuelle }}">

        <button type="submit" class="action-btn">
            Enregistrer
        </button>

        <a href="{% url 'properties:detail_locataire' locataire.pk %}" class="btn-secondary">
            Annuler
        </a>
    </form>
</div>
{% endblock %}
