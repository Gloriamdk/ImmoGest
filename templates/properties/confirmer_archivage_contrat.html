{% extends "base.html" %}

{% block content %}
<div class="card">

    <h1>Archiver ce contrat ?</h1>

    <p>
        Voulez-vous archiver ce contrat ?
    </p>

    <p>
        Le contrat sera retiré de la liste principale
        mais restera sauvegardé dans les archives.
    </p>

    <form method="post">
        {% csrf_token %}

        <button type="submit" class="btn-danger">
            Archiver
        </button>

        <a href="{% url 'properties:detail_contrat' contrat.pk %}" class="btn-secondary">
            Annuler
        </a>
    </form>

</div>
{% endblock %}
